name: CI

on:
  pull_request:
    branches: ["version-*", "develop-15"]
  push:
    branches: ["version-*", "develop-15"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-compile:
    name: Python compiles cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check every module (syntax/import errors only)
        run: python -m compileall -q batch_projects

  frappe-tests:
    name: Frappe test suite
    runs-on: ubuntu-latest
    # bench init + erpnext clone + site creation is inherently slow; this is a
    # whole-bench build, not a lint job. Do not trim this to the 10-20 minutes
    # the static jobs above use.
    timeout-minutes: 45
    env:
      BENCH_PATH: /home/runner/frappe-bench
      SITE_NAME: test_site
      DB_ROOT_PASSWORD: root
      ADMIN_PASSWORD: admin
      # Both declared frappe-dependencies in pyproject.toml are pinned to the
      # v15 line; nothing else (hrms, payments, ...) is a dependency of this app.
      FRAPPE_BRANCH: version-15
      ERPNEXT_BRANCH: version-15

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --password=root"
          --health-interval=5s --health-timeout=2s --health-retries=20
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=2s --health-retries=20
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=2s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-frappe-${{ env.FRAPPE_BRANCH }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y mariadb-client libmariadb-dev

      - name: Init bench
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch "$FRAPPE_BRANCH" \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            "$BENCH_PATH"

      - name: Point bench at the service containers
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port 3306 --parse
          bench set-config -g redis_cache "redis://127.0.0.1:13000"
          bench set-config -g redis_queue "redis://127.0.0.1:11000"
          bench set-config -g redis_socketio "redis://127.0.0.1:11000"
          mysql --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" \
            -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" \
            -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install apps onto a fresh site
        working-directory: ${{ env.BENCH_PATH }}
        env:
          CI: "Yes"
        run: |
          bench get-app erpnext --branch "$ERPNEXT_BRANCH" --skip-assets
          bench get-app batch_projects "$GITHUB_WORKSPACE" --skip-assets
          bench new-site \
            --db-root-password "$DB_ROOT_PASSWORD" \
            --admin-password "$ADMIN_PASSWORD" \
            --mariadb-user-host-login-scope=% \
            "$SITE_NAME"
          bench --site "$SITE_NAME" install-app erpnext
          bench --site "$SITE_NAME" install-app batch_projects
          # Explicit migrate: loads batch_projects fixtures (Custom Fields on
          # ERPNext doctypes, e.g. Timesheet Detail-custom_bp_task) that the
          # suite's tests depend on. install-app runs migrate, but an explicit
          # pass guarantees fixture sync even if the app was already installed.
          bench --site "$SITE_NAME" migrate

      - name: Seed ERPNext test fixtures missing from a fresh site
        working-directory: ${{ env.BENCH_PATH }}
        env:
          CI: "Yes"
        run: |
          # ERPNext's own test records (Warehouse / Company) reference the
          # "Transit" Warehouse Type, which is only created lazily by
          # erpnext.stock tests. On a fresh site the batch_projects suite's
          # make_test_records for those doctypes fails with
          # "Could not find Warehouse Type: Transit" before any test runs.
          # Create it up front so the deterministic suite is actually runnable.
          bench --site "$SITE_NAME" execute frappe.client.insert --kwargs '{"doc": {"doctype": "Warehouse Type", "name": "Transit"}}' || true
          # batch_projects/fixtures/custom_field.json is skipped wholesale when
          # ANY entry references a doctype absent from this minimal install
          # ("DocType Expense Claim Type not found"), which drops the
          # Timesheet Detail-custom_bp_task field the suite depends on. Create
          # that field explicitly so the deterministic suite is runnable.
          bench --site "$SITE_NAME" execute frappe.client.insert --kwargs '{"doc": {"doctype": "Custom Field", "dt": "Timesheet Detail", "fieldname": "custom_bp_task", "fieldtype": "Link", "label": "BP Task", "options": "BP Task", "insert_after": "task", "module": "Batch Projects"}}' || true
          # The add_sales_invoice_timesheet_detail_index patch's DB index does
          # not survive on a fresh minimal install (the patch's Property Setter
          # + add_index path is unreliable there). Add the index directly so
          # the reservation-concurrency suite is runnable.
          bench --site "$SITE_NAME" console <<'PYEOF'
          import frappe
          frappe.db.add_index("Sales Invoice Timesheet", ["timesheet_detail"], "bp_timesheet_detail_index")
          frappe.db.commit()
          PYEOF

      - name: Run the batch_projects test suite
        working-directory: ${{ env.BENCH_PATH }}
        env:
          CI: "Yes"
        run: |
          bench --site "$SITE_NAME" set-config allow_tests true
          bench --site "$SITE_NAME" run-tests --app batch_projects

  frontend-dist-drift:
    name: Frontend dist matches source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        working-directory: frontend
        run: NODE_ENV=development yarn install --production=false --frozen-lockfile
      - name: Preserve committed manifest
        run: cp batch_projects/public/frontend/.vite/manifest.json /tmp/bp-vite-manifest-committed.json
      - name: Build
        working-directory: frontend
        run: yarn build
      - name: Verify Vite manifest
        run: >-
          python .github/scripts/compare_vite_manifests.py
          /tmp/bp-vite-manifest-committed.json
          batch_projects/public/frontend/.vite/manifest.json
      - name: Fail if committed dist is stale
        run: |
          if ! git diff --exit-code -- . ':(exclude)batch_projects/public/frontend/.vite/manifest.json'; then
            echo "::error::public/frontend/ doesn't match a fresh 'yarn build' of frontend/src." \
                 "Run 'yarn build' inside frontend/ and commit the result in this PR."
            exit 1
          fi
