<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batch Projects</title>
    <link rel="stylesheet" href="/assets/batch_projects/frontend/{{ entry_css }}" />
</head>

<body class="antialiased">
    <div id="app"></div>
    <script>
        window.csrf_token = "{{ csrf_token }}";
        window.frappe = window.frappe || {};
        window.frappe.csrf_token = "{{ csrf_token }}";
        window.frappe.session = { user: "{{ frappe.session.user }}", user_fullname: "{{ user_fullname }}" };
        window["__BP_BRIDGE_URL__"] = "{{ bp_bridge_url }}";
    </script>
    <script type="module" src="/assets/batch_projects/frontend/{{ entry_js }}"></script>
</body>

</html>
