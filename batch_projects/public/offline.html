<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — BatchProjects</title>
  <style>
    body { font-family: 'Inter', 'Roboto', sans-serif; background: #f9fafb; color: #111827; margin: 0; }
    .wrap { max-width: 420px; margin: 0 auto; padding: 20vh 24px 0; text-align: center; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 14px; color: #6b7280; margin: 0 0 24px; }
    button { background: #111827; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>You're offline</h1>
    <p>BatchProjects needs a connection to load. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
