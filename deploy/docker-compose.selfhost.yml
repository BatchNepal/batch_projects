# batch_projects — self-host from nothing (ERPNext + MariaDB + Redis + this app)
#
# Follows frappe_docker's own service shape so it's familiar to anyone who's
# self-hosted ERPNext before: one-shot init containers (configurator,
# create-site) provision the site, then the long-running services (backend,
# frontend, websocket, queues, scheduler) come up. The `frappe/erpnext:v15`
# image already has ERPNext installed; create-site adds batch_projects on
# top via a normal `bench get-app` against this repo.
#
# Setup:
#   cp env.selfhost.example .env
#   # edit .env — set MARIADB_ROOT_PASSWORD, ADMIN_PASSWORD, SITE_NAME
#   docker compose -f docker-compose.selfhost.yml up -d
#   # first boot takes a few minutes (site creation + app install) — watch:
#   docker compose -f docker-compose.selfhost.yml logs -f create-site
#
# This stands up the free tier only. For the optional premium gateway
# add-on, see gateway-setup.md — separate, optional, install after this.

name: batch_projects

x-erpnext-image: &erpnext-image
  image: frappe/erpnext:${ERPNEXT_VERSION:-v15.44.0}

services:
  mariadb:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [bpnet]

  redis-cache:
    image: redis:6.2-alpine
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [bpnet]

  redis-queue:
    image: redis:6.2-alpine
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [bpnet]

  # One-shot: writes common_site_config.json (db/redis hosts), then exits.
  configurator:
    <<: *erpnext-image
    entrypoint:
      - bash
      - -c
    command:
      - >
        bench set-config -g db_host mariadb &&
        bench set-config -gp db_port 3306 &&
        bench set-config -g redis_cache "redis://redis-cache:6379" &&
        bench set-config -g redis_queue "redis://redis-queue:6379" &&
        bench set-config -g redis_socketio "redis://redis-queue:6379" &&
        bench set-config -gp socketio_port 9000
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    networks: [bpnet]

  # One-shot: creates the site + installs batch_projects, only if it
  # doesn't already exist yet (safe to re-run on container restart).
  create-site:
    <<: *erpnext-image
    entrypoint:
      - bash
      - -c
    command:
      - >
        set -e;
        if [ ! -f "sites/${SITE_NAME:-erp.localhost}/site_config.json" ]; then
          bench new-site "${SITE_NAME:-erp.localhost}"
            --mariadb-root-password "${MARIADB_ROOT_PASSWORD:?set in .env}"
            --admin-password "${ADMIN_PASSWORD:?set in .env}"
            --no-mariadb-socket
            --install-app erpnext;
          bench get-app batch_projects https://github.com/BatchNepal/batch_projects --branch version-15;
          bench --site "${SITE_NAME:-erp.localhost}" install-app batch_projects;
        else
          echo "Site already exists, skipping creation.";
        fi
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks: [bpnet]

  backend:
    <<: *erpnext-image
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      create-site:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/method/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [bpnet]

  websocket:
    <<: *erpnext-image
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [bpnet]

  queue-short:
    <<: *erpnext-image
    command: ["bench", "worker", "--queue", "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [bpnet]

  queue-long:
    <<: *erpnext-image
    command: ["bench", "worker", "--queue", "long"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [bpnet]

  scheduler:
    <<: *erpnext-image
    command: ["bench", "schedule"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [bpnet]

  frontend:
    <<: *erpnext-image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: "$${host}"
      UPSTREAM_REAL_IP_ADDRESS: "127.0.0.1"
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: "50m"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      create-site:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/method/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [bpnet]

networks:
  bpnet:

volumes:
  mariadb-data:
  redis-cache-data:
  redis-queue-data:
  sites:
