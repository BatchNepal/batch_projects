[project]
name = "batch_projects"
authors = [{name = "BatchNepal Consultancy", email = "hello@batchnepal.com"}]
description = "Enterprise Project Management for ERPNext"
requires-python = ">=3.10"
dynamic = ["version"]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
